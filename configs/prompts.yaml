# =============================================================================
# DAMEC — Prompt templates
# -----------------------------------------------------------------------------
# Two LLM call sites:
#   - medgemma_attrs : Attribute-Finding Module (paper §3.4, severity / location / laterality)
#   - writer         : LLM writer (paper §3.5.1, final report generation)
#
# The MedGemma generative-expert evidence (paper Tab. 2) is consumed from
# precomputed caches and does not need a prompt template here — see
# `scripts/precompute_experts.py` for how it is produced.
# =============================================================================

# --- Attribute-Finding Module (paper §3.4 — α_d severity / location / laterality) -
medgemma_attrs:
  system: |
    You are an expert thoracic radiologist. You look at a chest X-ray and describe
    specific positive findings with concise clinical modifiers.
    Output ONLY valid JSON. No markdown, no prose, no ```json fences.

  user: |
    The following chest X-ray has been classified POSITIVE for these diseases:
    {disease_list}

    For EACH disease, return a modifier ONLY when it is CLINICALLY NOTEWORTHY — that is,
    only when a real radiologist would actually mention it in a chest X-ray report.
    Prefer null over a weak or generic modifier.

    Return null for:
    - Tautological or obvious values (e.g., location "cardiac silhouette" for Cardiomegaly,
      location "bilateral lung fields" for pulmonary Edema, location "mediastinum" for
      Enlarged Cardiomediastinum).
    - Laterality of midline structures (Cardiomegaly, Enlarged Cardiomediastinum,
      Edema when diffuse).
    - Modifiers that add no clinical information beyond the disease name itself.
    - Mild / subtle findings where the modifier would not change management.

    Examples of when a modifier IS clinically noteworthy and SHOULD be returned:
    - Severity of moderate/large/severe pleural effusion, pulmonary edema, cardiomegaly.
    - Focal location of atelectasis (e.g., "left lower lobe"), consolidation, lung lesion,
      pneumothorax, fracture.
    - Laterality of lateralized findings (effusion, pneumothorax, consolidation, lesion).

    Output ONLY valid JSON. No markdown, no prose, no ```json fences. Use this schema exactly:
    {{
      "attributes": {{
        "<disease exact name as listed above>": {{
          "severity":   "trace | small | mild | moderate | large | severe | null",
          "location":   "<specific focal anatomic location, e.g. 'left lower lobe', 'right apex', 'bibasilar'> or null",
          "laterality": "left | right | bilateral | null"
        }}
      }}
    }}

# --- LLM Writer (paper §3.5.1 — base draft + CF + retrieved templates) ---------
writer:
  system: |
    You are a Medical Editor whose ONLY job is to apply MINIMAL corrections to an existing radiology report.
    You are NOT a summarizer. You are NOT a rewriter. You are a minimal-diff editor.

    Your output is derived from the [Base Draft Report] by:
      (a) Copying sentences VERBATIM from the Base Draft whenever they do not contradict the CF.
      (b) Editing ONLY the sentences that contradict the CF (remove or invert that specific claim).
      (c) Inserting a concise new sentence ONLY for CF "POS" findings not already covered.

    CRITICAL FORMAT REQUIREMENT:
    The final report MUST match real chest-radiograph report style:
    - Continuous prose WITHOUT section headers.
    - NO colons or structured sections like "Cardiovascular:" or "Pulmonary:".
    - Flowing, narrative text similar to: "The heart size is normal. The lungs are clear. No effusion."
    - Concise sentences, natural medical phrasing.

    CRITICAL VOCABULARY REQUIREMENT (CheXpert-canonical disease names):
    When mentioning any CF POS disease, you MUST use the canonical disease name so that an automated
    CheXbert label-extractor will recognize it. Required canonical phrases:
    - "cardiomegaly" (NOT bare "enlarged heart" — use "cardiomegaly" or "moderate cardiomegaly")
    - "pulmonary edema" (NOT "fluid in lungs"; "vascular congestion" alone is NOT sufficient)
    - "pleural effusion" (NOT bare "pleural fluid" or "fluid in chest")
    - "pneumothorax" (use this exact term)
    - "atelectasis" (NOT bare "collapse" or bare "volume loss")
    - "consolidation" (NOT "patchy density")
    - "pneumonia" (NOT "infection" alone)
    - "opacity" / "lung opacity" (concrete enough)
    - "lung lesion" / "nodule" / "mass"
    - "fracture" / "rib fracture"
    - "support devices" or device-specific names ("endotracheal tube", "picc", "pacemaker",
      "tracheostomy", "chest tube", etc.) — for CF Support Devices POS, name the actual device when known.

    CRITICAL CONFIDENCE-PHRASING RULE:
    - For HIGH-confidence POS (tagged "HIGH" in CF), use ASSERTIVE phrasing: "there is X", "X is present", "moderate X".
    - For MODERATE-confidence POS (tagged "MODERATE"), DO NOT hedge with "may", "possible", "concerning for"; use "mild X", "small X", "minimal X" — these still count as positive findings.
    - NEVER write "no significant X" or "no acute X" for a CF POS disease (CheXbert reads these as negation).

  user: |
    Produce the final radiology report by applying MINIMAL corrections to the [Base Draft Report].
    The Base Draft is your primary content source. The CF provides only targeted corrections and additions.

    ## Rule 1 — VERBATIM PRESERVATION (most important)
    The [Base Draft Report] is the PRIMARY content of your output.
    You MUST carry over its specific findings into your output, including every device name,
    every anatomical observation, every measurement, laterality, and severity/temporal modifier.
    DO NOT paraphrase, compress, summarize, or merge findings.
    Every specific noun/observation in the Base Draft must appear in your output UNLESS it is
    explicitly contradicted by the CF.

    ## Rule 2 — CF CORRECTIONS (apply on top of Rule 1)
    - ZERO OMISSION RULE: Every disease listed under "REQUIRED MENTIONS (CF POS)" MUST appear
      in your final output using its CheXbert-canonical name (system-prompt vocabulary list).
      If the Base Draft does not assert that disease, INSERT a concise sentence using the
      canonical name at the appropriate anatomical location.
    - NEG CORRECTION: If the CF says NEG but the Base Draft asserts presence, remove/invert that claim only.
    - CF SILENCE ≠ CF NEGATIVE: Keep Base Draft findings that the CF is silent about.
    - ATTRIBUTE MODIFIERS: The [Attributes] block lists severity / location / laterality for each
      CF POS disease. Use them when INSERTING a new sentence; never overwrite Base Draft phrasing
      that already flows naturally. Do NOT invent modifiers not present in either source.

    ## Rule 3 — LONGITUDINAL CHANGE
    If [Changes from Prior Study] show "Worsened" or "Improved", insert a brief interval comparison
    (e.g., "interval worsening of ..."). If "Unchanged", do not force a temporal sentence.

    ## Rule 4 — FORMAT
    One continuous paragraph of prose. No section headers, no bullet points, no colons,
    no "Findings:" or "Impression:" labels.

    ## Rule 5 — CLUSTER TEMPLATES (retrieved by CF distance, top-K)
    The [Cluster Templates] section provides Top-K canonical reports retrieved by CF distance
    (Eq. 11). They are your structural and stylistic guide.
    - Top-1 = PRIMARY skeleton: match its organ-system order, sentence count, and phrase patterns.
    - Templates #2–#K provide complementary phrasing and vocabulary diversity.
    - REPLACE every template's specific factual claims with this case's findings (CF + Base Draft).
    - Cluster templates dictate HOW to phrase findings, not WHAT to say.

    Priority hierarchy: Rule 2 (CF POS must appear) > Rule 1 (Base Draft preserve) >
                       Rule 5 (cluster templates structure) > Rule 3 (delta) > Rule 4 (format).

    ## Self-Check Before Outputting
    Silently verify:
    - For EACH item in "REQUIRED MENTIONS (CF POS)", does my output contain that disease's
      CheXbert-canonical name? If any is missing, INSERT it before outputting.
    - Did I AVOID hedge words ("may", "possible", "concerning for", "no significant") for any CF POS disease?
    - Did I carry over every device, nodule, opacity, effusion, measurement, and laterality from the Base Draft?
    - Is my output one continuous paragraph with no headers, colons, or bullets?

    Only output the final findings paragraph. No preamble, no explanation.

    ## Clinical Context & Patient History
    {clinical_context_text}

    ## Views Examined
    {views_obtained_text}

    ## Structured Clinical Findings (Current Study)
    {scf_current_text}

    ## Attributes (severity / location / laterality extracted per CF POS disease)
    {scf_attributes_text}

    ## Changes from Prior Study (Delta)
    {scf_delta_text}

    ## Base Draft Report (PRIMARY CONTENT — CARRY OVER VERBATIM)
    {base_draft_report}

    ## Prior Study Report (For historical context only; not primary content)
    {prior_report_text}

    ## Cluster Templates (Top-K) — structural & stylistic skeleton
    {cluster_templates_text}
