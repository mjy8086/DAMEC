precompute_dir: "<YOUR_CACHE_ROOT>"

classifier_tags: ["rad_dino", "convnext"]

train_split: "train"
val_split:   "val"
study_subset: null

min_images: 1
max_images: 6

subset_size_mode:  "stratified_random"
subset_size_ratio: [0.30, 0.30, 0.40]

batch_size:         32
stratified_ratio:   [0.20, 0.50, 0.30]
permutation_aug:    true
evidence_dropout:   0.15

lr:                  5.0e-4
weight_decay:        1.0e-2
grad_clip:           1.0
epochs:              60
early_stop_patience: 15
cosine_schedule:     true
pos_weight_power:    0.6

num_diseases:        14
view_dim:            3
hidden_dim:          64
disease_embed_dim:   16
tool_embed_dim:      8
n_sab_blocks:        2
n_heads:             4
attn_dropout:        0.1

base_b_ckpt:         null
finetune_calibration: true

output_dir: "outputs/consensus"
variant_tag: "main"
seed: 42
num_workers: 4
device: "cuda"
